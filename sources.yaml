# MeeNews sources
# enabled: true  -> fetched every run
# enabled: false -> candidate, only tested by `python fetch.py check`
# lang           -> original language (shown as "translated from ...")
# type           -> rss (default) or news-sitemap
# id_from: guid  -> dedupe by feed guid instead of link (for Google News redirects)
# no_summary     -> ignore the feed summary (Google News summaries are link lists)
# title_suffix   -> strip this from the end of titles

sources:
  - id: bbc-world
    name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    category: world
    lang: en
    enabled: true

  - id: bbc-tech
    name: BBC Technology
    url: https://feeds.bbci.co.uk/news/technology/rss.xml
    category: tech
    lang: en
    enabled: true

  - id: bbc-business
    name: BBC Business
    url: https://feeds.bbci.co.uk/news/business/rss.xml
    category: business
    lang: en
    enabled: true

  - id: bbc-science
    name: BBC Science
    url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    category: science
    lang: en
    enabled: true

  - id: dw-en
    name: DW English
    url: https://rss.dw.com/rdf/rss-en-all
    category: world
    lang: en
    enabled: true

  - id: dw-es
    name: DW Spanish
    url: https://rss.dw.com/rdf/rss-sp-all
    category: world
    lang: es
    enabled: true

  - id: dw-ru
    name: DW Russian
    url: https://rss.dw.com/xml/rss-ru-rus
    category: world
    lang: ru
    enabled: true

  - id: dw-zh
    name: DW Chinese
    url: https://rss.dw.com/xml/rss-chi-all
    category: world
    lang: zh
    enabled: true

  - id: aljazeera
    name: Al Jazeera
    url: https://www.aljazeera.com/xml/rss/all.xml
    category: world
    lang: en
    enabled: true

  - id: sky-world
    name: Sky News World
    url: https://feeds.skynews.com/feeds/rss/world.xml
    category: world
    lang: en
    enabled: true

  - id: guardian-world
    name: The Guardian World
    url: https://www.theguardian.com/world/rss
    category: world
    lang: en
    enabled: true

  - id: france24-en
    name: France 24 EN
    url: https://www.france24.com/en/rss
    category: world
    lang: en
    enabled: true

  - id: france24-fr
    name: France 24 FR
    url: https://www.france24.com/fr/rss
    category: world
    lang: fr
    enabled: true

  - id: bangkokpost-opinion
    name: Bangkok Post Opinion
    url: https://www.bangkokpost.com/rss/data/opinion.xml
    category: th
    lang: en
    enabled: true

  - id: npr-world
    name: NPR World
    url: https://feeds.npr.org/1004/rss.xml
    category: world
    lang: en
    enabled: true
    note: may be blocked outside the US

  - id: reuters-gn
    name: Reuters (via Google News)
    url: https://news.google.com/rss/search?q=site:reuters.com+when:2h&hl=en-US&gl=US&ceid=US:en
    category: world
    lang: en
    enabled: true
    id_from: guid
    no_summary: true
    title_suffix: " - Reuters"
    note: titles only, no full text

  - id: ap-gn
    name: AP (via Google News)
    url: https://news.google.com/rss/search?q=site:apnews.com+when:2h&hl=en-US&gl=US&ceid=US:en
    category: world
    lang: en
    enabled: true
    id_from: guid
    no_summary: true
    title_suffix: " - AP News"
    note: titles only, no full text

