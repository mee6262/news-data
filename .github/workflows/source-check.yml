name: source-check

# Phase 0: run by hand to test every source from GitHub's network.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python fetch.py check

      - name: Show report in job summary
        if: always()
        run: cat docs/source-check.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check
          path: |
            docs/source-check.md
            source-check.json
          retention-days: 7
